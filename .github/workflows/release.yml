name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  metadata:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: release
        name: Guard release version
        shell: bash
        run: |
          if [[ ! -f VERSION ]]; then
            echo "::error::VERSION is missing; release not published."
            exit 1
          fi

          version="$(cat VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::VERSION must contain a semantic version in X.Y.Z form; release not published."
            exit 1
          fi

          tag="v${version}"
          set +e
          remote_result="$(git ls-remote --exit-code --tags origin "refs/tags/${tag}" 2>&1)"
          remote_status=$?
          set -e

          if [[ $remote_status -eq 0 ]]; then
            echo "::error::Duplicate version ${tag} found; release not published. Update VERSION before the next main release."
            exit 1
          fi
          if [[ $remote_status -ne 2 ]]; then
            echo "::error::Could not check whether ${tag} already exists; release not published."
            echo "$remote_result" >&2
            exit "$remote_status"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            platform: darwin-x64
          - runner: macos-15
            platform: darwin-arm64
          - runner: ubuntu-24.04
            platform: linux-x64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
          - runner: windows-2025
            platform: win32-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up CMake and Ninja
        uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb
        with:
          cmakeVersion: 4.4.2
          ninjaVersion: 1.13.2
      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Set up dependencies
        if: runner.os != 'Windows'
        run: ./setup.sh
      - name: Set up dependencies on Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: setup.bat
      - name: Configure release
        run: cmake --preset release --fresh
      - name: Build release
        run: cmake --build --preset release --parallel 2
      - name: Test release
        run: ctest --preset release --output-on-failure
      - name: Install release
        run: cmake --install build/release --prefix build/release/install
      - name: Install extension dependencies
        working-directory: extensions/vscode
        run: npm ci
      - name: Test extension
        working-directory: extensions/vscode
        run: npm test
      - name: Package and verify artifacts
        run: >-
          python tools/package_release.py
          --install build/release/install
          --platform ${{ matrix.platform }}
          --extension extensions/vscode
          --output dist
      - uses: actions/upload-artifact@v4
        with:
          name: email-markup-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [metadata, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Verify downloaded checksums
        working-directory: dist
        run: sha256sum --check *.sha256
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.metadata.outputs.tag }}
          name: Email Markup ${{ needs.metadata.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          make_latest: true
          files: dist/*
          fail_on_unmatched_files: true
