name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metadata:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      short_sha: ${{ steps.release.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v4
      - id: release
        name: Resolve immutable release identity
        shell: bash
        run: |
          version="$(awk '/^[[:space:]]*VERSION / { print $2; exit }' CMakeLists.txt)"
          if [[ -z "$version" ]]; then
            echo "Could not read the project version from CMakeLists.txt." >&2
            exit 1
          fi
          short_sha="${GITHUB_SHA:0:12}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}-${short_sha}" >> "$GITHUB_OUTPUT"

  build:
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            platform: darwin-x64
          - runner: macos-15
            platform: darwin-arm64
          - runner: ubuntu-24.04
            platform: linux-x64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
          - runner: windows-2025
            platform: win32-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Set up dependencies
        if: runner.os != 'Windows'
        run: ./setup.sh
      - name: Set up dependencies on Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: setup.bat
      - name: Configure release
        run: cmake --preset release --fresh
      - name: Build release
        run: cmake --build --preset release --parallel 2
      - name: Test release
        run: ctest --preset release --output-on-failure
      - name: Install release
        run: cmake --install build/release --prefix build/release/install
      - name: Install extension dependencies
        working-directory: extensions/vscode
        run: npm ci
      - name: Test extension
        working-directory: extensions/vscode
        run: npm test
      - name: Package and verify artifacts
        run: >-
          python tools/package_release.py
          --install build/release/install
          --platform ${{ matrix.platform }}
          --extension extensions/vscode
          --output dist
      - uses: actions/upload-artifact@v4
        with:
          name: email-markup-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [metadata, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Verify downloaded checksums
        working-directory: dist
        run: sha256sum --check *.sha256
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.metadata.outputs.tag }}
          name: Email Markup ${{ needs.metadata.outputs.version }} (${{ needs.metadata.outputs.short_sha }})
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          make_latest: true
          files: dist/*
          fail_on_unmatched_files: true
